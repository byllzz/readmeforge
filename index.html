<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--  Primary SEO  -->
  <title>ReadmeForge - Build Stunning GitHub READMEs in Minutes</title>
  <meta name="description"
    content="Create beautiful, professional READMEs with a visual drag‐and‐drop editor. Live preview, markdown export, and no sign‐up required. Your data stays local." />
  <meta name="keywords"
    content="readme builder, markdown generator, github readme, visual readme editor, open source readme tool, readme creator" />
  <meta name="author" content="ReadmeForge" />
  <meta name="robots" content="index, follow" />

  <!--  Favicon  -->
  <link rel="icon" type="image/svg+xml" href="./src/assets/favicon.svg" />
  <link rel="shortcut icon" href="./src/assets/favicon.svg" type="image/x-icon">

  <!--
    Critical inline CSS: paints the correct background instantly, before the
    JS bundle or external CSS has loaded. This is what actually kills the
    white-flash-on-reload - nothing in React/localStorage can fix a flash
    that happens before React mounts.
  -->
  <style>
    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      background: #f5f4ef;
    }
  </style>

  <!--  Font Preconnects & Fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
    media="print" onload="this.media='all'" />
